name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install ruff
        run: pipx install ruff
      - name: ruff check
        run: ruff check --output-format=github src tests build-aux
      - name: ruff format
        run: ruff format --check src tests build-aux
      - name: Versions agree
        run: python3 build-aux/check-version.py

  test:
    # Ubuntu 24.04 ships the oldest libadwaita (1.5) and GTK we support.
    name: Build and test (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson gettext desktop-file-utils appstream libglib2.0-bin libglib2.0-dev-bin \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-secret-1 gir1.2-gtksource-5 \
            python3-paramiko python3-pytest xvfb dbus-daemon
      - name: Configure
        run: meson setup build
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs
      - name: UI smoke test
        env:
          G_DEBUG: fatal-criticals
          GDK_BACKEND: x11
        run: dbus-run-session -- xvfb-run -a meson devenv -C build python3 "$PWD/tests/smoke_ui.py"
      - name: Install
        run: DESTDIR="$PWD/staging" meson install -C build
