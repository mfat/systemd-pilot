name: AppImage

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  appimage:
    name: AppImage
    # Pinned, not ubuntu-latest: 24.04 is the oldest Ubuntu that carries
    # libadwaita >= 1.5. Its glibc is bundled for hosts older than it (AppRun
    # chooses), but hosts at least as new run on their own, and the host GL,
    # X11 and font libraries the image does not bundle must be ABI-compatible
    # with this build -- so moving to a newer image still raises the floor.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      # Everything the AppImage bundles is taken from these packages: the build
      # tools Meson needs, the GTK 4 stack with its typelibs, and the data GTK
      # loads by path (icon theme, SVG pixbuf loader, dconf GSettings backend).
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson \
            ninja-build \
            gettext \
            desktop-file-utils \
            appstream \
            libglib2.0-bin \
            libglib2.0-dev-bin \
            python3-gi \
            python3-gi-cairo \
            python3-pip \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-gtksource-5 \
            gir1.2-secret-1 \
            adwaita-icon-theme \
            hicolor-icon-theme \
            librsvg2-common \
            dconf-gsettings-backend \
            patchelf \
            wget \
            xvfb \
            dbus-x11

      - name: Build AppImage
        run: |
          # Builds with Meson, like the .deb and .rpm, then bundles the GTK
          # stack, CPython and paramiko around it. The script smoke-tests the
          # AppDir under env -i before packing, so a missing library or typelib
          # fails here rather than on a user's machine.
          dbus-run-session -- xvfb-run -a packaging/appimage/build-appimage.sh

      # APPIMAGE_EXTRACT_AND_RUN: the runner has no FUSE mount available. It
      # changes how the image is started, not what is in it.
      - name: Verify the AppImage starts
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          set -eu
          APPIMAGE=$(ls dist/*.AppImage)
          "$APPIMAGE" --help >/dev/null

      - name: Verify the GUI starts under the bundled stack
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          GDK_BACKEND: x11
          G_DEBUG: fatal-criticals
        run: |
          set -eu
          APPIMAGE=$(ls dist/*.AppImage)
          # The app runs until killed; timeout's 124 is the success case.
          status=0
          dbus-run-session -- xvfb-run -a timeout 60 "$APPIMAGE" || status=$?
          [ "$status" -eq 124 ] || [ "$status" -eq 0 ]

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage

  # The point of the AppImage: it has to run where the .deb cannot. Ubuntu
  # 22.04 has no libadwaita 1.5 and an older glibc, so this exercises the
  # bundled C library and AppRun's choices for older hosts, on a real 22.04
  # userland rather than the build host pretending.
  test-ubuntu-2204:
    name: AppImage on Ubuntu 22.04
    needs: appimage
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: appimage
          path: dist

      # Only what a 22.04 desktop already has (GL, X11, fonts, the MIME
      # database); nothing from the GTK 4 stack, and no Python.
      - name: Install the host libraries a desktop provides
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libgl1 libegl1 libgl1-mesa-dri libgbm1 libdrm2 \
            libx11-6 libx11-xcb1 libxcb1 libwayland-client0 \
            libfontconfig1 libfreetype6 libfribidi0 libharfbuzz0b fonts-dejavu-core \
            libexpat1 zlib1g shared-mime-info \
            xvfb xauth dbus dbus-x11

      - name: Test the AppImage
        run: |
          # Artifacts do not keep the executable bit.
          chmod +x dist/*.AppImage
          dbus-run-session -- xvfb-run -a packaging/appimage/test-appimage.sh dist/*.AppImage
